<script>
  (function () {
    var origFetch = window.fetch;
    if (!origFetch) return;
    window.fetch = function (input) {
      try {
        var url = (typeof input === 'string') ? input : ((input && input.url) || '');
        if (url.indexOf('blob:') === 0 || url.indexOf('data:') === 0) {
          return new Promise(function (resolve, reject) {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url);
            xhr.responseType = 'arraybuffer';
            xhr.onload = function () { resolve(new Response(xhr.response, { status: 200 })); };
            xhr.onerror = function () { reject(new TypeError('Failed to fetch')); };
            xhr.send();
          });
        }
      } catch (e) {}
      return origFetch.apply(this, arguments);
    };
  })();
</script>

<style>

  .settings-island { position:absolute; top:68px; right:16px; z-index:14; width:280px; max-height:calc(100% - 90px); overflow-y:auto; background:color-mix(in srgb, var(--surface) 52%, transparent); border:1px solid color-mix(in srgb, var(--border) 50%, transparent); border-radius:18px; box-shadow:0 12px 36px rgba(0,0,0,.1); padding:16px; display:flex; flex-direction:column; gap:14px; transform-origin:top right; transition:opacity .18s ease, transform .18s ease; backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }

  [slot^="hotspot"] { background:var(--surface); color:var(--text); border:1.5px solid var(--accent); border-radius:999px; padding:3px 8px; font-size:11px; font-weight:700; white-space:nowrap; box-shadow:0 1px 6px rgba(0,0,0,.18); position:relative; }
  /* Per-item size chips: zero-size anchor on the item, chip above it on a leader line. */
  [slot^="hotspot"].dim-anchor { width:0; height:0; padding:0; border:0; background:none; box-shadow:none; pointer-events:none; overflow:visible; --dy:0px; }

  .dim-label.item::after { content:""; position:absolute; left:50%; bottom:-5px; transform:translateX(-50%); border-width:5px 4px 0 4px; border-style:solid; border-color:var(--dot,var(--accent)) transparent transparent transparent; }

/* Compare / multi-view additions — intentionally follows the original UI language. */
.compare-layout { position:absolute; inset:0; display:grid; gap:8px; padding:8px; z-index:2; }
.compare-layout[data-count="1"] { grid-template-columns:1fr; grid-template-rows:1fr; }
#controlRail, #gearBtn, #fitBtn, #layoutBtn, #viewCloseStack { display:none !important; }

  border-radius:10px;

}

.view-cube-corner { position:absolute; width:8px; height:8px; border-radius:50%; border:1px solid color-mix(in srgb,#fff 26%,transparent); background:color-mix(in srgb,#fff 14%,transparent); cursor:pointer; pointer-events:auto; opacity:.5; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); transition:opacity .16s ease,background .16s ease; }
.view-cube-corner:hover { opacity:1; background:color-mix(in srgb,var(--accent) 22%,transparent); }
.view-cube-corner.tl { left:2px; top:2px; }

.compare-layout-panel { position:absolute; top:68px; right:68px; z-index:90; width:min(280px, calc(100vw - 24px)); background:color-mix(in srgb, var(--surface) 52%, transparent); border:1px solid color-mix(in srgb, var(--border) 50%, transparent); border-radius:18px; box-shadow:0 12px 36px rgba(0,0,0,.1); padding:14px; display:flex; flex-direction:column; gap:10px; backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }

  function showToast(msg){

  function setGlobalVisibility(){
    const firstSlot = panes[0] && panes[0].slots[0];
    const anyLoaded = panes.some(p=>p.slots.some(s=>s.viewer));
    // The wave is one constant effect: it never switches off, it just keeps
    // sweeping the whole page behind/around every View.
    const showGlobal = true;
    // The big "tap to open" hint only shows while nothing is loaded anywhere.
    const showHint = !anyLoaded && paneCount===1;
    globalPlaceholder.classList.toggle('hidden', !showGlobal);
    placeholder.classList.toggle('hidden', !showHint);
    // The very first (untouched) page is fully transparent so the wave reads clearly.
    wrap.classList.toggle('blank', showHint);
    updateInstallBtn(showHint);
    controlRail.classList.add('hidden'); gearBtn.classList.add('hidden'); fitBtn.classList.add('hidden'); layoutBtn.classList.add('hidden'); viewCloseStack.classList.add('hidden');
    panes.forEach((p,idx)=>{
      const hasLoaded=p.slots.some(s=>s.viewer);
      const multi=paneCount>1;
      p.controlRail.classList.toggle('hidden',!(hasLoaded||multi));
      p.closeStack.classList.toggle('hidden',!multi);
      if(p.expandBtn){
        p.expandBtn.classList.toggle('hidden',!multi);
        if(!multi){ p.el.classList.remove('pane-expanded'); p.expandBtn.classList.remove('active'); p.expandBtn.innerHTML=svg('expand'); p.expandBtn.title='Expand this View';
          const layoutEl=document.getElementById('compareLayout'); if(layoutEl) layoutEl.classList.remove('has-expanded'); }
      }
      p.fitBtn.classList.toggle('hidden',!hasLoaded);
      p.compareBtn.classList.toggle('hidden',!(hasLoaded||multi));
      p.viewCube.classList.toggle('hidden',!hasLoaded);
      p.sceneToolRail.classList.toggle('hidden',!hasLoaded);
      if(!hasLoaded) { p.sceneToolPanel.classList.add('hidden'); p.objectBtn.classList.remove('active'); placeToolPanel(p,false); }
      if(hasLoaded) scheduleCubeUpdate(p);
      p.label.textContent='View '+(idx+1);
      p.el.classList.toggle('is-active',p===activePane);
      p.slots.forEach(s=>{
        s.settingsGear.style.display=s.viewer?'flex':'none';
        s.closeBtn.style.display=s.viewer?'flex':'none';
        /* Only the untouched first page hides its empty state (the big hint sits
           on top of it). Every other empty View must stay tappable so a model
           can be dropped in again after removing one. */
        if(s.empty){ if(showHint && s===firstSlot) s.empty.classList.add('hidden'); else if(!s.viewer) s.empty.classList.remove('hidden'); }
      });
    });
  }

  /* Only the light of the viewer itself is adjusted, and only for models that have no
     material of their own (those get the softer, brighter studio light). A file that
     brings its own material is always lit by the normal viewer light. */
  function applyPlainLook(slot){
    const v=slot.viewer; if(!v) return;
    v.setAttribute('exposure',slot.plainLook?PLAIN_EXPOSURE:FILE_EXPOSURE);
  }

  function makeViewer(slot){
    const v = document.createElement('model-viewer');
    v._envRot=slot.envRot||0;
    v.setAttribute('alt','3D model');
    v.setAttribute('camera-controls','');
    v.setAttribute('disable-tap','');
    v.setAttribute('shadow-intensity','0.75');
    v.setAttribute('exposure','1');
    v.setAttribute('ar','');
    v.setAttribute('ar-modes','webxr scene-viewer quick-look');
    v.setAttribute('xr-environment','');
    v.setAttribute('interaction-prompt','none');
    v.setAttribute('zoom-sensitivity', String(zoomSens()));
    v.setAttribute('interpolation-decay','90');
    v.setAttribute('touch-action','none');
    v.setAttribute('max-camera-orbit','auto 179.9deg 180%');
    v.setAttribute('min-camera-orbit','auto 0.1deg 70%');
    v.setAttribute('camera-orbit','auto auto auto');
    v.setAttribute('field-of-view','auto');
     v.setAttribute('min-field-of-view','20deg');
     v.setAttribute('max-field-of-view','42deg');
    /* The original slotted AR button: model-viewer decides when to show it
       (phones/tablets only, when an AR mode is actually available). */
    const ar = document.createElement('button');
    ar.setAttribute('slot','ar-button');
    ar.className='btn btn-sm ar-button';
    ar.type='button';
    ar.innerHTML=svg('ar')+'<span>View in AR</span>';
    v.appendChild(ar);
    slot.el.appendChild(v);
    slot.viewer = v;

    v.addEventListener('load',()=>{
      slot.loading=false;
      slot.empty.classList.add('hidden');
      slot.settingsGear.classList.remove('hidden');
      slot.closeBtn.classList.remove('hidden');
      try{ initModelMaterials(slot); }catch(err){ console.warn(err); }
      try{
        if(!slot.plainLook) applyProductLighting(v);
      }catch(_){}
      try{ clearDimLabels(slot); }catch(_){}
      slot._parts=null;
      try{ populateMaterials(slot); }catch(_){}
      try{ applyPlainLook(slot); }catch(_){}
      try{ applySavedEnv(slot); }catch(_){}
      try{ populateAnimations(slot); }catch(_){}
      try{ setDisplayMode(slot,'shaded',false); }catch(_){}
      try{ frameModelTight(slot); }catch(_){}
      try{ updateAutoRotate(slot); }catch(_){}
      try{ updateAnimationFloat(slot); }catch(_){}
      try{ refreshDimensions(slot); }catch(_){}
      try{ setGlobalVisibility(); }catch(_){}
      const anim=!!slot._revealAnim; slot._revealAnim=false; let played=false, warmed=false;
      const reveal=()=>{
        try{ v.classList.remove('mv-reveal-pending'); v.classList.add('mv-revealed'); }catch(_){}
        if(anim && !played){ played=true; try{ requestAnimationFrame(()=>playMaterialReveal(slot)); }catch(_){} }
        if(!warmed){ warmed=true; try{ schedulePresetWarmup(slot); }catch(_){} }
      };
      /* reveal immediately so the model is never stuck invisible */
      reveal();
      requestAnimationFrame(reveal);
      setTimeout(reveal, 800);
    });
    v.addEventListener('error',()=>{ try{ v.classList.remove('mv-reveal-pending'); v.classList.add('mv-revealed'); }catch(_){} showToast('The 3D file could not be loaded. Try another file.'); });
    v.addEventListener('play',()=>{ if(slot.rate!==1) return; slot.playing=true; slot._animIconPlaying=null; updateAnimationFloat(slot); startAnimationTicker(slot); });
    v.addEventListener('pause',()=>{ if(slot.rate!==1) return; slot.playing=false; slot._animIconPlaying=null; updateAnimationFloat(slot); stopAnimationTicker(slot); });
    v.addEventListener('finished',()=>{ slot.playing=false; slot._animIconPlaying=null; updateAnimationFloat(slot); });
    /* Locked face (Top / Right / ...): dragging to rotate leaves the face and goes back to
       the normal perspective view. Zoom never changes the field of view here (that was the
       zoom bug) - it moves the camera in/out instead, see lockZoomBy(). */
    v.addEventListener('camera-change',(e)=>{
      if(!slot.viewLocked || !e.detail || e.detail.source!=='user-interaction') return;
      try{
        const o=v.getCameraOrbit && v.getCameraOrbit();
        if(!o || slot.lockedTheta==null || slot.lockedPhi==null) return;
        const x=(((o.theta*180/Math.PI - slot.lockedTheta)%360)+360)%360;
        const dth=Math.min(x,360-x);
        const dph=Math.abs(o.phi*180/Math.PI - slot.lockedPhi);
        if(dth>3 || dph>3) releaseLockedView(slot);
      }catch(_){}
    });
    const lockZoomBy=(f)=>{
      if(!slot.viewLocked || !slot._lockR0 || !isFinite(f) || f<=0) return;
      slot._lockR=Math.min(slot._lockR0*3.5, Math.max(slot._lockR0*0.25, (slot._lockR||slot._lockR0)*f));
      startLockZoom(slot);
    };
    v.addEventListener('wheel',(e)=>{
      if(!slot.viewLocked || !slot._lockR0) return;
      e.preventDefault(); e.stopPropagation();
      let dy=e.deltaY; if(e.deltaMode===1) dy*=33; else if(e.deltaMode===2) dy*=300;
      lockZoomBy(Math.exp(Math.max(-300,Math.min(300,dy))*0.0011*(zoomSens()/1.4)));
    },{capture:true,passive:false});
    { const ptrs=new Map(); let pinchD=0;
      v.addEventListener('pointerdown',(e)=>{ ptrs.set(e.pointerId,[e.clientX,e.clientY]); pinchD=0; });
      v.addEventListener('pointermove',(e)=>{
        if(!ptrs.has(e.pointerId)) return;
        ptrs.set(e.pointerId,[e.clientX,e.clientY]);
        if(ptrs.size===2 && slot.viewLocked){
          const p=[...ptrs.values()]; const d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);
          if(pinchD>0 && d>0) lockZoomBy(pinchD/d);
          pinchD=d;
        }
      });
      const endP=(e)=>{ ptrs.delete(e.pointerId); pinchD=0; };
      v.addEventListener('pointerup',endP); v.addEventListener('pointercancel',endP);
    }
    v.addEventListener('camera-change',()=>{ document.body.classList.add('is-moving'); clearTimeout(window.__mvT); window.__mvT=setTimeout(()=>document.body.classList.remove('is-moving'),160); });
    v.addEventListener('camera-change',()=>{ scheduleCubeUpdate(slot.pane); if(slot.dimMode==='peritem') scheduleDeclutter(slot); });
    ar.addEventListener('click',(e)=>{ e.preventDefault(); e.stopPropagation(); launchAR(slot); });
    v.addEventListener('ar-status',(e)=>{
      if(e.detail && e.detail.status==='failed') showToast(arHelpText());
    });
    return v;
  }

  /* WebXR only runs in a secure context (https or localhost). A plain file://
     or a LAN http:// address can never start AR, so explain it instead of
     failing silently. The 3D viewer itself keeps working either way. */
  function isSecureARContext(){
    if(window.isSecureContext) return true;
    const h=String(location.hostname||'').replace(/^\[|\]$/g,'');
    return h==='localhost'||h==='127.0.0.1'||h==='::1';
  }
  function arHelpText(){
    if(!isSecureARContext()) return 'AR needs a secure page. Open this file over http://localhost (run "npx serve" or "python -m http.server" in this folder) or an https tunnel. A file:// or LAN http:// address cannot start AR.';
    if(window.self!==window.top) return 'AR needs the page opened in its own tab, not inside an embed or preview frame.';
    return 'AR is not available here. Use Chrome on Android; note that iPhone needs a USDZ version of the model.';
  }
  function launchAR(slot){
    const v=slot.viewer; if(!v) return;
    if(!isSecureARContext()||window.self!==window.top||typeof v.activateAR!=='function'){ showToast(arHelpText()); return; }
    try{ v.activateAR(); }catch(err){ showToast(arHelpText()); }
  }

  function formatTime(seconds){
    seconds=Math.max(0,Number(seconds)||0);
    const mins=Math.floor(seconds/60);
    const secs=Math.floor(seconds%60).toString().padStart(2,'0');
    return mins+':'+secs;
  }

  const SPEEDS=[0.25,0.5,1,1.5,2];

  function hasAnimation(slot){
    const v=slot.viewer;
    if(!v) return false;
    return ((v.availableAnimations||[]).length>0) || (Number(v.duration)||0)>0;
  }

  function updateAnimationFloat(slot){
    if(!slot.viewer || !hasAnimation(slot)){
      slot.animFloat.classList.add('hidden');
      slot.pane.el.classList.remove('has-animation');
      slot.animPicker.classList.add('hidden');
      return;
    }
    const duration=Number(slot.viewer.duration)||0;
    const max=Math.max(duration,0.001);
    slot.animTimeline.max=String(max);
    const cur=Math.min(Number(slot.viewer.currentTime)||0, max);
    // Avoid fighting the user while scrubbing
    if(document.activeElement !== slot.animTimeline){
      slot.animTimeline.value=String(cur);
    }
    slot.animTime.textContent=formatTime(cur)+' / '+formatTime(duration);
    slot.animFloat.classList.remove('hidden');
    slot.pane.el.classList.add('has-animation');
    const label=slot.rate+'×';
    if(slot.animSpeed.textContent!==label){
      slot.animSpeed.textContent=label;
      slot.animSpeed.classList.toggle('fast', slot.rate>1);
      slot.animSpeed.classList.toggle('slow', slot.rate<1);
      slot.animSpeed.title = 'Playback speed · '+label;
    }
    // Only rewrite the icon when the state changes — rewriting every frame breaks clicks
    if(slot._animIconPlaying !== slot.playing){
      slot._animIconPlaying = slot.playing;
      slot.animToggle.innerHTML = slot.playing ? svg('pause') : svg('play');
      slot.animToggle.title = slot.playing ? 'Pause animation' : 'Play animation';
      slot.animToggle.setAttribute('aria-label', slot.animToggle.title);
    }
    if(slot._animName !== slot.viewer.animationName){
      slot._animName = slot.viewer.animationName;
      markActiveAnimation(slot, slot._animName);
    }
  }

  function syncAnimationFloat(slot){ updateAnimationFloat(slot); }

  /* Playback control. At 1x the viewer animates itself; any other speed is
     driven manually from the ticker so the rate can be slowed down or sped up. */
  function setPlaying(slot,on){
    const v=slot.viewer;
    if(!v) return;
    slot.playing=!!on;
    if(slot.playing){
      if(!v.animationName && (v.availableAnimations||[])[0]) v.animationName=v.availableAnimations[0];
      if(slot.rate===1){
        try{ v.play({repetitions:Infinity}); }catch(_){ try{ v.play(); }catch(__){} }
      }else{
        try{ v.pause(); }catch(_){}
      }
    }else{
      try{ v.pause(); }catch(_){}
    }
    slot._animIconPlaying=null;
    if(slot.playing) startAnimationTicker(slot); else stopAnimationTicker(slot);
    updateAnimationFloat(slot);
  }

  function startAnimationTicker(slot){
    stopAnimationTicker(slot);
    let last=performance.now();
    const tick=(now)=>{
      slot.animationRAF=null;
      const v=slot.viewer;
      if(!v || !slot.playing) return;
      if(slot.rate!==1){
        const dur=Number(v.duration)||0;
        if(dur>0){
          const dt=Math.min((now-last)/1000,0.2);
          last=now;
          let t=Number(v.currentTime)||0;
          t+=dt*slot.rate;
          if(t>=dur) t=t%dur;
          try{ v.currentTime=t; }catch(_){}
        }
      }
      updateAnimationFloat(slot);
      slot.animationRAF=requestAnimationFrame(tick);
    };
    slot.animationRAF=requestAnimationFrame(tick);
  }

  function stopAnimationTicker(slot){
    if(slot.animationRAF){
      cancelAnimationFrame(slot.animationRAF);
      slot.animationRAF=null;
    }
  }

  function findSlotFromElement(el){
    const slotEl=el?.closest?.('.model-slot');
    if(!slotEl) return null;
    for(const pane of panes){
      const slot=pane.slots.find(s=>s.el===slotEl);
      if(slot) return slot;
    }
    return null;
  }

  function findPaneFromElement(el){
    const paneEl=el?.closest?.('.compare-pane');
    if(!paneEl) return null;
    return panes.find(p=>p.el===paneEl)||null;
  }

  let activePane=null;
  document.addEventListener('pointerover',e=>{
    const s=findSlotFromElement(e.target);
    if(s && s.viewer) lastActiveSlot=s;
  },{passive:true});

  function activatePane(pane){
    const prev=activePane;
    activePane=pane||null;
    panes.forEach(p=>p.el.classList.toggle('is-active',p===activePane));
    /* switching side: close menus from previous side so they reopen on the new page context */
    if(prev && pane && prev!==pane){
      try{ closeAllMatPresets(); }catch(_){}
      try{ closeAllSettings(); }catch(_){}
      try{ closeSceneToolPanels(); }catch(_){}
    }
  }
  function openLayoutPanel(pane){
    closeSceneToolPanels();
    try{ closeAllMatPresets(); }catch(_){}
    try{ closeAllSettings(); }catch(_){}
    activatePane(pane);
    buildLayoutPanel();
    const rect=pane?.el?.getBoundingClientRect();
    const wrapRect=wrap.getBoundingClientRect();
    if(rect){
      const panelW=Math.min(280,Math.max(240,wrap.clientWidth-24));
      const left=Math.min(Math.max(12,rect.right-wrapRect.left-panelW-10),Math.max(12,wrap.clientWidth-panelW-12));
      const bottom=Math.max(12,wrap.clientHeight-(rect.bottom-wrapRect.top)-52);
      layoutPanel.style.left=left+'px'; layoutPanel.style.right='auto'; layoutPanel.style.top='auto'; layoutPanel.style.bottom=bottom+'px'; layoutPanel.style.transformOrigin='bottom left';
    }
    const heading=layoutPanel.querySelector('.panel-heading');
    if(heading) heading.textContent='Comparison views';
    layoutPanel.classList.remove('hidden');
  }

  function resolveDropTarget(x,y){
    const el=document.elementFromPoint(x,y);
    const slot=findSlotFromElement(el);
    if(slot) return {type:'slot',slot};
    const pane=findPaneFromElement(el);
    if(pane){
      const slot=pane.slots[0];
      return slot?{type:'slot',slot}:{type:'pane',pane};
    }
    if(!globalPlaceholder.classList.contains('hidden') && panes[0]?.slots[0]){
      return {type:'slot',slot:panes[0].slots[0]};
    }
    return null;
  }

  let activeDropVisual=null;
  function clearDropVisual(){
    if(!activeDropVisual) return;
    activeDropVisual.el.classList.remove('is-drag-over');
    activeDropVisual.el.removeAttribute('data-drop-label');
    activeDropVisual=null;
    wrap.classList.remove('dragging-file');
  }

  function setDropVisual(target){
    clearDropVisual();
    if(!target) return;
    const isSlot=target.type==='slot';
    const el=isSlot?target.slot.el:target.pane.el;
    const pane=isSlot?target.slot.pane:target.pane;
    const paneIndex=panes.indexOf(pane)+1;
    const slotIndex=isSlot?pane.slots.indexOf(target.slot)+1:1;
    el.classList.add('drop-target','is-drag-over');
    el.setAttribute('data-drop-label',`View ${paneIndex} · Drop here`);
    activeDropVisual={el};
    wrap.classList.add('dragging-file');
  }

  function isFileDrag(e){
    return !!(e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes('Files'));
  }

  /* On phones the sheet moves out to the page root (a View clips its children), exactly like the settings sheet. */
  function placeToolPanel(pane,open){

      root.add(discMesh(THREE,Rb-c1,0,M.marble()));

      const rTop=Rs*.95, sh=[];
      for(let k=0;k<=24;k++){ const t=k/24; sh.push(V(rB2+(rTop-rB2)*t+Rs*.022*Math.sin(Math.PI*t),yB+(yC-yB)*t)); }

      }else root.add(latheMesh(THREE,sh,M.marble(),Rt));

      const b=Rc*.93, up=[];
      for(let k=0;k<=8;k++){ const f=k/8*Math.PI/2; up.push([rTop+(b-rTop)*(1-Math.cos(f)),yC+hCav*Math.sin(f),0]); }

      root.add(discMesh(THREE,Rc-c2,H,M.marble()));

  async function importSceneForComposite(url){
    const THREE=await libImport('three'); const {GLTFLoader}=await libImport('three/addons/loaders/GLTFLoader.js');

  /* v11: the parsed source model is kept (per URL) so switching presets does not parse
     the whole file again. Each use gets its own copy; animated/skinned files are always
     read fresh so their bones stay correct. */
  const _sceneCache=new Map();
  async function importSceneCached(url){
    let e=_sceneCache.get(url);
    if(!e){
      e=importSceneForComposite(url);
      _sceneCache.set(url,e);
      e.catch(()=>_sceneCache.delete(url));
      while(_sceneCache.size>3) _sceneCache.delete(_sceneCache.keys().next().value);
    }
    const g=await e;
    let skinned=false; g.scene.traverse(o=>{ if(o.isSkinnedMesh) skinned=true; });
    if(skinned||(g.animations&&g.animations.length)){ _sceneCache.delete(url); return importSceneForComposite(url); }
    return {scene:g.scene.clone(true),animations:g.animations||[]};
  }
  /* v11: after a model is shown, the three.js engine, the parsed model and the preset
     textures are prepared in idle time, so the first preset click is quick. */
  function schedulePresetWarmup(slot){
    if(slot._warmed===slot.objectURL) return; slot._warmed=slot.objectURL;
    const idle=window.requestIdleCallback?(f=>window.requestIdleCallback(f,{timeout:4000})):(f=>setTimeout(f,1200));
    idle(async()=>{
      try{
        const THREE=await libImport('three');
        await libImport('three/addons/exporters/GLTFExporter.js');
        const src=slot.compositeURL||slot.objectURL;
        if(src && !slot._override) importSceneCached(src).catch(()=>{});
        const ids=[]; MATERIAL_PRESETS.forEach(g=>g.items.forEach(p=>ids.push(p.id)));
        const step=()=>{ const id=ids.shift(); if(!id) return; try{ presetMaterial(THREE,id); }catch(_){} idle(step); };
        idle(step);
      }catch(_){}
    });
  }
  async function exportCompositeGLB(originalURL,baseKey,params,override){
    const THREE=await libImport('three'); const {GLTFExporter}=await libImport('three/addons/exporters/GLTFExporter.js');
    const orig=await importSceneForComposite(originalURL);
    const item=orig.scene;
    item.updateMatrixWorld(true);
    /* A preset the user picked is put on the model first, so the base is built around it
       and the two never fight over the model's material. */
    if(override) applyOverrideToScene(THREE,item,override);
    // exact (vertex based) box, so the centre of the model is really the centre
    const ib=new THREE.Box3().setFromObject(item,true);
    const ic=ib.getCenter(new THREE.Vector3());
    const itemSize={x:Math.max(ib.max.x-ib.min.x,.001),y:Math.max(ib.max.y-ib.min.y,.001),z:Math.max(ib.max.z-ib.min.z,.001)};
    const info={};
    const baseScene=await buildBaseScene(THREE,baseKey,itemSize,params,info);
    // mark the group AND every mesh inside it: the size tool skips anything named
    // like this, so a pedestal never gets measured as part of the model
    baseScene.name=BASE_MARK;
    baseScene.traverse(o=>{ if(o.isMesh) o.name=BASE_MARK+'_'+(o.name||'part'); });
    baseScene.updateMatrixWorld(true);
    const bb=new THREE.Box3().setFromObject(baseScene);
    // the base is built around x=0,z=0: put that centre exactly under the centre of the model
    baseScene.position.set(ic.x, ib.min.y-bb.max.y+.0005, ic.z);
    baseScene.updateMatrixWorld(true);
    const root=new THREE.Group(); root.name='ModelWithDisplayBase'; root.add(baseScene); root.add(item);
    root.updateMatrixWorld(true);
    const all0=new THREE.Box3().setFromObject(root);
    // model centre over the origin, base bottom on the floor
    root.position.set(-ic.x,-all0.min.y,-ic.z);
    root.updateMatrixWorld(true);
    const all=new THREE.Box3().setFromObject(root);
    const ac=all.getCenter(new THREE.Vector3());
    const fw=Math.max(itemSize.x,(info.width||0)*.9), fh=itemSize.y+.1, fd=Math.max(itemSize.z,(info.depth||0)*.9);
    const itemCentreY=ic.y-all0.min.y;
    // where the camera should look, relative to the centre of the whole (tall) model
    const focus={dx:0-ac.x, dy:(itemCentreY-.05)-ac.y, dz:0-ac.z, diag:Math.hypot(fw,fh,fd), fullDiag:all.getSize(new THREE.Vector3()).length()};
    const blob=await new Promise((resolve,reject)=>{
      const exporter=new GLTFExporter(); exporter.parse(root,g=>resolve(new Blob([g],{type:'model/gltf-binary'})),reject,{binary:true,animations:orig.animations||[],maxTextureSize:4096});
    });
    return {blob,info,focus};
  }
  async function applyBaseObject(slot,key){
    if(!slot?.viewer || !OBJECT_DEFS[key]) return;
    if(slot._baseBusy){ slot._baseAgain=key; return; }
    slot._baseBusy=true;
    try{
      if(!slot.objectURL){showToast('The current model is not ready yet.');return;}
      showToast('Building '+objectDefsLabel(key)+'…');
      const params=slot.baseParams||(slot.baseParams={height:null,margin:1.16});
      /* A preset is written into the composite itself, so the model keeps it. */
      const {blob,info,focus}=await exportCompositeGLB(slot.objectURL,key,params,slot._override);
      if(slot.compositeURL)URL.revokeObjectURL(slot.compositeURL);
      slot.compositeURL=URL.createObjectURL(blob); slot.baseKey=key; slot.baseInfo=info;
      if(slot._presetURL){URL.revokeObjectURL(slot._presetURL);slot._presetURL=null;}
      slot.viewer.__focus=focus;
      slot.viewer.src=slot.compositeURL;
      slot.viewer.addEventListener('load',()=>{frameModelTight(slot);setGlobalVisibility();},{once:true});
      updateObjectCards(slot); showToast(objectDefsLabel(key)+' added: '+Math.round(info.height*100)+' cm tall.');
    }catch(err){console.error(err);showToast('Could not add the base. Try GLB/GLTF/OBJ/STL first.');}
    finally{
      slot._baseBusy=false;
      if(slot._baseAgain){ const k=slot._baseAgain; slot._baseAgain=null; applyBaseObject(slot,k); }
    }
  }
  function objectDefsLabel(key){return OBJECT_DEFS[key]?.name||'Base';}
  async function clearBaseObject(slot){
    if(!slot?.viewer||!slot.baseKey)return;

    if(slot.compositeURL){URL.revokeObjectURL(slot.compositeURL);slot.compositeURL=null;}
    slot.baseKey=null; slot.baseInfo=null; slot.viewer.__focus=null;

  /* ===== Other 3D formats =====
     GLB opens directly. STL and OBJ are converted by built-in code (no internet needed).
     FBX / PLY / 3DS / 3MF / DAE / GLTF use Three.js from the CDN; it is fetched once and
     then kept by the browser cache, so it also works offline afterwards.
     Everything is converted to GLB in the browser, so every tool (materials, animation,
     dimensions, AR) works the same for all formats.
     Units: STL / OBJ / FBX / PLY / 3DS / 3MF are read as MILLIMETRES. */
  const MODEL_EXTS=['glb','gltf','fbx','obj','stl','ply','dae','3mf','3ds','step','stp'];
  const MM=0.001; // 1 file unit = 1 mm = 0.001 m (GLB is in metres)
  function extOf(n){ const m=/\.([a-z0-9]+)$/i.exec(n||''); return m?m[1].toLowerCase():''; }
  function splitFiles(list){
    const files=Array.from(list||[]).filter(Boolean);

  /* ---------- STL (binary + ASCII), Z-up mm -> Y-up metres ----------
     Vertices are welded and given smooth normals (sharp edges stay sharp), so the model is
     lighter and shaded like a normal GLB. */
  function stlToModel(buf){
    const dv=new DataView(buf);
    let n=0, raw=null;
    const isBinary=buf.byteLength>=84 && (84+dv.getUint32(80,true)*50===buf.byteLength);
    if(isBinary){
      n=dv.getUint32(80,true);

      for(let t=0;t<n;t++,o+=50){ for(let k=0;k<9;k++) raw[t*9+k]=dv.getFloat32(o+12+k*4,true); }
    }else{
      const txt=new TextDecoder().decode(new Uint8Array(buf));
      const re=/vertex\s+(\S+)\s+(\S+)\s+(\S+)/g; const vals=[]; let m;
      while((m=re.exec(txt))){ vals.push(parseFloat(m[1]),parseFloat(m[2]),parseFloat(m[3])); }
      n=Math.floor(vals.length/9);
      raw=Float32Array.from(vals.slice(0,n*9));
    }
    if(!n) throw new Error('No triangles found in this STL file');
    const total=n*3;
    // Z-up -> Y-up: (x,y,z) -> (x,z,-y); also turns -0 into 0 so equal vertices match exactly
    for(let c=0;c<total;c++){
      const x=raw[c*3], y=raw[c*3+1], z=raw[c*3+2];
      raw[c*3]=x+0; raw[c*3+1]=z+0; raw[c*3+2]=(-y)+0;
    }
    // 1) weld identical vertices
    const u32=new Uint32Array(raw.buffer,raw.byteOffset,raw.length);
    let size=1; while(size<total*2) size<<=1;
    const mask=size-1, table=new Int32Array(size).fill(-1);
    const rep=new Int32Array(total), vid=new Int32Array(total);
    let nV=0;
    for(let c=0;c<total;c++){
      const a=u32[c*3], b=u32[c*3+1], d=u32[c*3+2];
      // murmur-style mixing (float bit patterns of round numbers share low bits, so plain XOR would clump)
      let h=0, k=Math.imul(a,0xcc9e2d51); k=(k<<15)|(k>>>17); h^=Math.imul(k,0x1b873593); h=(h<<13)|(h>>>19); h=(Math.imul(h,5)+0xe6546b64)|0;
      k=Math.imul(b,0xcc9e2d51); k=(k<<15)|(k>>>17); h^=Math.imul(k,0x1b873593); h=(h<<13)|(h>>>19); h=(Math.imul(h,5)+0xe6546b64)|0;
      k=Math.imul(d,0xcc9e2d51); k=(k<<15)|(k>>>17); h^=Math.imul(k,0x1b873593); h=(h<<13)|(h>>>19); h=(Math.imul(h,5)+0xe6546b64)|0;
      h^=h>>>16; h=Math.imul(h,0x85ebca6b); h^=h>>>13; h=Math.imul(h,0xc2b2ae35); h^=h>>>16;
      h=(h>>>0)&mask;
      for(;;){
        const e=table[h];
        if(e<0){ table[h]=nV; rep[nV]=c; vid[c]=nV; nV++; break; }
        const rc=rep[e];
        if(u32[rc*3]===a&&u32[rc*3+1]===b&&u32[rc*3+2]===d){ vid[c]=e; break; }
        h=(h+1)&mask;
      }
    }
    // 2) face normals
    const fnRaw=new Float64Array(n*3), fnUnit=new Float64Array(n*3);
    for(let t=0;t<n;t++){
      const b=t*9;
      const ux=raw[b+3]-raw[b], uy=raw[b+4]-raw[b+1], uz=raw[b+5]-raw[b+2];
      const vx=raw[b+6]-raw[b], vy=raw[b+7]-raw[b+1], vz=raw[b+8]-raw[b+2];
      const nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
      fnRaw[t*3]=nx; fnRaw[t*3+1]=ny; fnRaw[t*3+2]=nz;
      const l=Math.hypot(nx,ny,nz);
      if(l>0){ fnUnit[t*3]=nx/l; fnUnit[t*3+1]=ny/l; fnUnit[t*3+2]=nz/l; }
    }
    // 3) triangles around each vertex
    const start=new Int32Array(nV+1);
    for(let c=0;c<total;c++) start[vid[c]+1]++;
    for(let i=0;i<nV;i++) start[i+1]+=start[i];
    const fillAt=start.slice(0,nV), around=new Int32Array(total);
    for(let c=0;c<total;c++) around[fillAt[vid[c]]++]=(c/3)|0;
    // 4) smooth normal per corner (edges sharper than ~55 degrees stay sharp), then share equal ones
    const COS=0.57;
    const outPos=new Float32Array(total*3), outNor=new Float32Array(total*3);
    const head=new Int32Array(nV).fill(-1), nextOut=new Int32Array(total);
    const index=new Uint32Array(total);
    let nOut=0;
    for(let c=0;c<total;c++){
      const t=(c/3)|0, v=vid[c];
      let sx=0,sy=0,sz=0;
      const tx=fnUnit[t*3], ty=fnUnit[t*3+1], tz=fnUnit[t*3+2];
      for(let k=start[v];k<start[v+1];k++){
        const u=around[k];
        if(tx*fnUnit[u*3]+ty*fnUnit[u*3+1]+tz*fnUnit[u*3+2]>COS){ sx+=fnRaw[u*3]; sy+=fnRaw[u*3+1]; sz+=fnRaw[u*3+2]; }
      }
      let nx,ny,nz; const l=Math.hypot(sx,sy,sz);
      if(l>0){ nx=sx/l; ny=sy/l; nz=sz/l; }
      else if(tx||ty||tz){ nx=tx; ny=ty; nz=tz; }
      else { nx=0; ny=1; nz=0; }
      let found=-1;
      for(let o=head[v];o>=0;o=nextOut[o]){
        if(outNor[o*3]*nx+outNor[o*3+1]*ny+outNor[o*3+2]*nz>0.9995){ found=o; break; }
      }
      if(found<0){
        found=nOut++;
        outPos[found*3]=raw[c*3]*MM; outPos[found*3+1]=raw[c*3+1]*MM; outPos[found*3+2]=raw[c*3+2]*MM;
        outNor[found*3]=nx; outNor[found*3+1]=ny; outNor[found*3+2]=nz;
        nextOut[found]=head[v]; head[v]=found;
      }
      index[c]=found;
    }
    /* STL carries no material at all: the viewer default goes straight into the file
       that is written out, so it is there from the first frame. */
    const dm=viewerDefaultMaterialJSON().pbrMetallicRoughness;
    return {
      images:[],
      materials:[{name:'Viewer Default',color:[...dm.baseColorFactor],rough:dm.roughnessFactor,metal:dm.metallicFactor,image:-1}],
      meshes:[{name:'model',pos:outPos.slice(0,nOut*3),nor:outNor.slice(0,nOut*3),uv:null,idx:index,mat:0}]
    };
  }
  /* Puts the model's centre over the origin and its bottom on the floor, like a normal GLB. */
  function recenterModel(model){
    const mn=[Infinity,Infinity,Infinity], mx=[-Infinity,-Infinity,-Infinity];
    model.meshes.forEach(m=>{ for(let k=0;k<m.pos.length;k+=3){ for(let a=0;a<3;a++){ const v=m.pos[k+a]; if(v<mn[a]) mn[a]=v; if(v>mx[a]) mx[a]=v; } } });
    if(!isFinite(mn[0])) return;
    const dx=-(mn[0]+mx[0])/2, dy=-mn[1], dz=-(mn[2]+mx[2])/2;
    model.meshes.forEach(m=>{ for(let k=0;k<m.pos.length;k+=3){ m.pos[k]+=dx; m.pos[k+1]+=dy; m.pos[k+2]+=dz; } });
  }

  /* ---------- OBJ (+ MTL, JPG/PNG textures), Y-up, mm -> metres ---------- */
  function parseMTL(text){
    const mats=new Map(); let cur=null;
    text.split(/\r?\n/).forEach(line=>{
      const t=line.trim().split(/\s+/); if(!t[0]||t[0][0]==='#') return;

      else if(key==='d') cur.alpha=isNaN(parseFloat(t[1]))?1:parseFloat(t[1]);
      else if(key==='tr') cur.alpha=1-(parseFloat(t[1])||0);
      else if(key==='ns'){ const ns=parseFloat(t[1])||0; cur.rough=Math.min(1,Math.max(0.15,1-Math.sqrt(Math.max(ns,0)/1000))); }
      else if(key==='map_kd' && t.length>1) cur.map=t[t.length-1];
    });

  function viewerDefaultMaterialJSON(){

        else if(line.charCodeAt(1)===110){ const t=line.trim().split(/\s+/); VN.push(+t[1],+t[2],+t[3]); }

        if(uv){ const t=g.idx[i*3+1]; if(t>=0&&t*2+1<VT.length){ uv[i*2]=VT[t*2]; uv[i*2+1]=1-VT[t*2+1]; } }
        if(allN){ const n=g.idx[i*3+2]; let x=VN[n*3],y=VN[n*3+1],z=VN[n*3+2]; const l=Math.hypot(x,y,z)||1; nor[i*3]=x/l; nor[i*3+1]=y/l; nor[i*3+2]=z/l; }

          const nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
          fnRaw[t*3]=nx; fnRaw[t*3+1]=ny; fnRaw[t*3+2]=nz;
          const l=Math.hypot(nx,ny,nz)||1;
          fnUnit[t*3]=nx/l; fnUnit[t*3+1]=ny/l; fnUnit[t*3+2]=nz/l;
        }
        // triangles touching each vertex (compact arrays)
        const maxV=V.length/3;
        const start=new Int32Array(maxV+1);
        for(let i=0;i<nC;i++) start[vIdx[i]+1]++;
        for(let i=0;i<maxV;i++) start[i+1]+=start[i];
        const fill=start.slice(0,maxV), list=new Int32Array(nC);
        for(let i=0;i<nC;i++){ list[fill[vIdx[i]]++]=(i/3)|0; }
        for(let i=0;i<nC;i++){
          const t=(i/3)|0, v=vIdx[i];
          let sx=0,sy=0,sz=0;
          for(let k=start[v];k<start[v+1];k++){

            const dot=fnUnit[t*3]*fnUnit[u*3]+fnUnit[t*3+1]*fnUnit[u*3+1]+fnUnit[t*3+2]*fnUnit[u*3+2];
            if(dot>COS){ sx+=fnRaw[u*3]; sy+=fnRaw[u*3+1]; sz+=fnRaw[u*3+2]; }
          }
          let l=Math.hypot(sx,sy,sz);
          if(l>1e-30){ nor[i*3]=sx/l; nor[i*3+1]=sy/l; nor[i*3+2]=sz/l; }
          else { nor[i*3]=fnUnit[t*3]; nor[i*3+1]=fnUnit[t*3+1]; nor[i*3+2]=fnUnit[t*3+2]; }
        }
      }

  /* ---------- Three.js path (FBX, PLY, 3DS, 3MF, DAE, GLTF) ---------- */

        .then(([THREE,ex])=>({THREE,GLTFExporter:ex.GLTFExporter}));

    const {THREE,GLTFExporter}=await loadThreeLib();
    const urlMap=new Map(), made=[];
    extras.forEach(f=>{ const u=URL.createObjectURL(f); made.push(u); urlMap.set(f.name.toLowerCase(),u); });
    const manager=new THREE.LoadingManager();
    let pending=0;
    const origStart=manager.itemStart, origEnd=manager.itemEnd;
    manager.itemStart=function(u){ pending++; return origStart.call(manager,u); };
    manager.itemEnd=function(u){ pending=Math.max(0,pending-1); return origEnd.call(manager,u); };
    manager.setURLModifier(url=>{
      if(/^(blob:|data:)/.test(url)) return url;
      let name=url.split('?')[0].split(/[\\/]/).pop();
      try{ name=decodeURIComponent(name); }catch(_){}
      return urlMap.get(name.toLowerCase())||url;
    });
    try{
      let root=null, clips=[], srcMat=null;
      const wrap=(obj,fn)=>{ const g=new THREE.Group(); g.add(obj); fn&&fn(g); return g; };
      if(ext==='gltf'){
        const {GLTFLoader}=await importAddon('loaders/GLTFLoader.js');
        const text=await file.text();
        srcMat=gltfMaterialInfo(JSON.parse(text));          // what the file itself declares
        const g=await new GLTFLoader(manager).parseAsync(text,'');
        root=g.scene; clips=g.animations||[];
      }else if(ext==='fbx'){
        const {FBXLoader}=await importAddon('loaders/FBXLoader.js');
        const obj=new FBXLoader(manager).parse(await file.arrayBuffer(),'');
        clips=obj.animations||[];
        root=wrap(obj,g=>g.scale.setScalar(MM));
      }else if(ext==='ply'){
        const {PLYLoader}=await importAddon('loaders/PLYLoader.js');
        const geo=new PLYLoader().parse(await file.arrayBuffer());
        const hasColor=!!geo.attributes.color;
        let obj;
        /* PLY stores colours, never materials: without vertex colours the viewer default
           is used and is written into the file straight away. */
        const dm=viewerDefaultMaterialJSON().pbrMetallicRoughness;
        if(geo.index||geo.attributes.normal){
          if(!geo.attributes.normal) geo.computeVertexNormals();
          obj=new THREE.Mesh(geo,hasColor
            ? new THREE.MeshStandardMaterial({color:0xffffff,metalness:0.1,roughness:0.6,vertexColors:true,side:THREE.DoubleSide})
            : new THREE.MeshStandardMaterial({color:new THREE.Color().setRGB(dm.baseColorFactor[0],dm.baseColorFactor[1],dm.baseColorFactor[2]),metalness:dm.metallicFactor,roughness:dm.roughnessFactor,side:THREE.DoubleSide}));
        }else{
          obj=new THREE.Points(geo,new THREE.PointsMaterial({size:0.005,vertexColors:hasColor,color:hasColor?0xffffff:0xb9b9b9}));
        }
        root=wrap(obj,g=>{ g.rotation.x=-Math.PI/2; g.scale.setScalar(MM); });
      }else if(ext==='dae'){
        const {ColladaLoader}=await importAddon('loaders/ColladaLoader.js');
        const c=new ColladaLoader(manager).parse(await file.text(),'');
        root=c.scene; clips=c.animations||[];
      }else if(ext==='3mf'){
        const {ThreeMFLoader}=await importAddon('loaders/3MFLoader.js');
        root=wrap(new ThreeMFLoader(manager).parse(await file.arrayBuffer()),g=>g.scale.setScalar(MM));
      }else if(ext==='3ds'){
        const {TDSLoader}=await importAddon('loaders/TDSLoader.js');
        const obj=new TDSLoader(manager).parse(await file.arrayBuffer(),'');
        root=wrap(obj,g=>{ g.rotation.x=-Math.PI/2; g.scale.setScalar(MM); });
      }else{
        throw new Error('Unsupported format');
      }
      let parts=0; root.traverse(o=>{ if(o.isMesh||o.isPoints||o.isLine) parts++; });
      if(!parts) throw new Error('No 3D geometry found in this file');
      useStandardMaterials(THREE,root);
      const matSource=materialOrigin(ext,srcMat,root);
      /* A file with no material of its own gets the viewer default written into the file
         that is exported here, so it is never on screen without a material first. */
      if(matSource!=='file') applyViewerDefaultToScene(THREE,root);
      // wait until every texture request has finished (or 10 s)
      const t0=performance.now();
      while(pending>0 && performance.now()-t0<10000) await new Promise(r=>setTimeout(r,40));
      let removed=cleanTextures(root,false);
      const run=()=>new Promise((resolve,reject)=>{
        new GLTFExporter().parse(root,
          res=>resolve(new Blob([res],{type:'model/gltf-binary'})),
          err=>reject(err instanceof Error?err:new Error('Export failed')),
          {binary:true,animations:clips,onlyVisible:true,maxTextureSize:4096});
      });
      let blob;
      try{ blob=await run(); }
      catch(e1){
        // last resort: open without any textures instead of failing
        removed+=cleanTextures(root,true);
        blob=await run();
        return {blob,matSource,note:'Opened without textures (they could not be read).'};
      }
      return {blob,matSource,note:removed?'Some textures were missing, select the texture images together with the model file.':''};
    }finally{
      made.forEach(u=>URL.revokeObjectURL(u));
    }
  }
  /* Did the file bring a material of its own? PLY only stores colours, never a material.
     glTF is decided by its own JSON; the other formats by what their loader built. */
  function materialOrigin(ext,srcMat,root){
    if(ext==='ply') return 'default';
    if(srcMat) return (srcMat.material||srcMat.texture)?'file':'default';
    return sceneBringsMaterial(root)?'file':'default';
  }
  /* Puts the viewer default on every mesh that has no material of its own, keeping each
     mesh's own side and vertex-colour flags. */
  function applyViewerDefaultToScene(THREE,root){
    const dm=viewerDefaultMaterialJSON().pbrMetallicRoughness;
    const base=new THREE.MeshStandardMaterial({
      name:'Viewer Default',
      color:new THREE.Color(dm.baseColorFactor[0],dm.baseColorFactor[1],dm.baseColorFactor[2]),
      roughness:dm.roughnessFactor, metalness:dm.metallicFactor
    });
    root.traverse(o=>{
      if(!o.isMesh||!o.geometry||!o.geometry.attributes||!o.geometry.attributes.position) return;
      const prev=Array.isArray(o.material)?o.material[0]:o.material;
      const m=base.clone();
      if(prev){ if(typeof prev.side==='number') m.side=prev.side; if(prev.vertexColors) m.vertexColors=true; }
      o.material=m;
    });
  }

  let occtPromise=null;
  function loadOcct(){
    if(!occtPromise){
      occtPromise=(typeof occtimportjs==='function' ? occtimportjs(window.__occtOptions? window.__occtOptions() : undefined) : Promise.reject(new Error('STEP engine is unavailable.')));
    }
    return occtPromise;
  }
  async function convertStepWithOcct(file){
    const THREE=await libImport('three'); const {GLTFExporter}=await libImport('three/addons/exporters/GLTFExporter.js');
    const occt=await loadOcct();
    const content=new Uint8Array(await file.arrayBuffer());
    /* Mesh fineness. The last version was too coarse: curved surfaces showed flat facets.
       Angular deflection is what keeps curves round, so it is now much finer (about 8.5 deg for
       normal files); very large files still get a slightly lighter mesh so they open in time. */
    const mb=content.length/1048576;
    let lin=0.00025, ang=0.15;
    if(mb>6){ lin=0.0004; ang=0.2; }
    if(mb>20){ lin=0.0007; ang=0.28; }
    await new Promise(r=>setTimeout(r,30));   // let the "Opening..." message show before the engine blocks the page
    const result=occt.ReadStepFile(content,{linearUnit:'meter',linearDeflectionType:'bounding_box_ratio',linearDeflection:lin,angularDeflection:ang});
    if(!result || !result.success || !Array.isArray(result.meshes) || !result.meshes.length) throw new Error('STEP file could not be triangulated.');
    const root=new THREE.Group(); root.name=file.name.replace(/\.[^.]+$/,'');
    /* One material per distinct colour (not one per face): far fewer draw calls and a smaller file. */
    const matCache=new Map();
    let cadColours=false;                          /* did the STEP file itself carry colours? */
    const chan=v=>{ const n=Number(v); return isFinite(n)?Math.min(1,Math.max(0,n)):0.75; };
    const getMat=c=>{
      const has=Array.isArray(c)&&c.length>=3;
      if(has) cadColours=true;
      const key=has?[chan(c[0]),chan(c[1]),chan(c[2])].map(v=>Math.round(v*255)).join(','):'plain';
      let mt=matCache.get(key);
      if(!mt){
        const dm=viewerDefaultMaterialJSON().pbrMetallicRoughness;
        mt=new THREE.MeshStandardMaterial(has
          ?{color:new THREE.Color(chan(c[0]),chan(c[1]),chan(c[2])),roughness:.42,metalness:.08,side:THREE.DoubleSide}
          /* a STEP without colours: the viewer default, written in from the start */
          :{color:new THREE.Color(dm.baseColorFactor[0],dm.baseColorFactor[1],dm.baseColorFactor[2]),roughness:dm.roughnessFactor,metalness:dm.metallicFactor,side:THREE.DoubleSide});
        matCache.set(key,mt);
      }
      return {mt,key};
    };
    result.meshes.forEach((m,mi)=>{
      const srcPos=m.attributes?.position?.array; if(!srcPos || !srcPos.length) return;
      /* STEP/CAD is Z-up; Three.js / model-viewer are Y-up: (x,y,z) -> (x, z, -y) for positions and normals. */
      const n=srcPos.length, pos=new Float32Array(n);
      for(let i=0;i<n;i+=3){ pos[i]=srcPos[i]; pos[i+1]=srcPos[i+2]; pos[i+2]=-srcPos[i+1]; }
      const geo=new THREE.BufferGeometry();
      geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
      const srcNor=m.attributes?.normal?.array;
      if(srcNor && srcNor.length===n){
        const nor=new Float32Array(n);
        for(let i=0;i<n;i+=3){ nor[i]=srcNor[i]; nor[i+1]=srcNor[i+2]; nor[i+2]=-srcNor[i+1]; }
        geo.setAttribute('normal',new THREE.BufferAttribute(nor,3));
      }
      const idxRaw=m.index?.array;
      const idx=idxRaw? (ArrayBuffer.isView(idxRaw)?idxRaw:Uint32Array.from(idxRaw)) : null;
      const faces=Array.isArray(m.brep_faces)?m.brep_faces:[];
      let material;
      if(idx && faces.length){
        const total=idx.length, tri=total/3;
        const covered=new Uint8Array(tri);
        const byKey=new Map();
        faces.forEach(f=>{
          const t0=Math.max(0,Number(f.first)|0), t1=Math.min(tri-1,Number(f.last)|0);
          if(!(t1>=t0)) return;
          const {mt,key}=getMat(f.color||m.color);
          let g=byKey.get(key); if(!g){ g={mt,ranges:[]}; byKey.set(key,g); }
          g.ranges.push([t0,t1]);
          for(let t=t0;t<=t1;t++) covered[t]=1;
        });
        /* triangles no face claimed keep the mesh colour, so nothing disappears */
        const rest=[]; for(let t=0;t<tri;t++) if(!covered[t]) rest.push(t);
        if(rest.length){ const {mt,key}=getMat(m.color); let g=byKey.get(key); if(!g){ g={mt,ranges:[]}; byKey.set(key,g); } rest.forEach(t=>g.ranges.push([t,t])); }
        const out=new Uint32Array(total); let p=0; const mats=[];
        byKey.forEach(g=>{
          const start=p;
          g.ranges.forEach(([t0,t1])=>{ out.set(idx.subarray(t0*3,(t1+1)*3),p); p+=(t1-t0+1)*3; });
          if(p>start){ geo.addGroup(start,p-start,mats.length); mats.push(g.mt); }
        });
        geo.setIndex(new THREE.BufferAttribute(out.subarray(0,p),1));
        material=mats.length===1?mats[0]:mats;
        if(mats.length===1) geo.clearGroups();
      }else{
        if(idx) geo.setIndex(new THREE.BufferAttribute(idx instanceof Uint32Array?idx:Uint32Array.from(idx),1));
        material=getMat(m.color).mt;
      }
      if(!geo.attributes.normal) geo.computeVertexNormals();
      const mesh=new THREE.Mesh(geo,material); mesh.name=m.name||('STEP Part '+(mi+1)); mesh.castShadow=true; mesh.receiveShadow=true; root.add(mesh);
    });
    if(!root.children.length) throw new Error('STEP file contains no visible geometry.');
    root.updateMatrixWorld(true);
    // Put the model centre over the origin and its bottom on the floor (like STL/OBJ).
    const box=new THREE.Box3().setFromObject(root,true);
    if(isFinite(box.min.x)){
      const c=box.getCenter(new THREE.Vector3());
      root.position.set(-c.x, -box.min.y, -c.z);
      root.updateMatrixWorld(true);
    }
    const exporter=new GLTFExporter();
    const blob=await new Promise((resolve,reject)=>exporter.parse(root,g=>resolve(new Blob([g],{type:'model/gltf-binary'})),reject,{binary:true,maxTextureSize:4096}));
    /* Colours that came out of the CAD file are the file's own material and are kept;
       only a STEP without any colour gets the viewer's default material. */
    return {blob,note:'',matSource:cadColours?'file':'default'};
  }

  /* Does the file itself carry a material or a texture? For GLB / glTF only the JSON
     part is read — the geometry, the textures and the viewer are never touched. */
  function gltfMaterialInfo(json){
    try{
      if(!json||typeof json!=='object') return null;
      const mats=Array.isArray(json.materials)?json.materials:[];
      return {material:mats.length>0, texture:!!((json.textures&&json.textures.length)||(json.images&&json.images.length))};
    }catch(_){ return null; }
  }
  async function glbMaterialInfo(blob){
    try{
      const head=new Uint8Array(await blob.slice(0,20).arrayBuffer());
      if(head.length<20) return null;
      const dv=new DataView(head.buffer);
      if(dv.getUint32(0,true)!==0x46546c67) return null;                       // not a GLB ("glTF")
      const len=dv.getUint32(12,true);
      if(dv.getUint32(16,true)!==0x4e4f534a||len<=0||len>16777216) return null; // first chunk must be JSON
      const txt=new TextDecoder().decode(new Uint8Array(await blob.slice(20,20+len).arrayBuffer()));
      return gltfMaterialInfo(JSON.parse(txt));
    }catch(_){ return null; }
  }
  /* FBX / DAE / 3MF / 3DS: these loaders only build materials when the file has some. */
  function sceneBringsMaterial(root){
    let found=false;
    root.traverse(o=>{
      if(found||!o.material) return;
      const arr=Array.isArray(o.material)?o.material:[o.material];
      for(const m of arr){
        if(!m) continue;
        if(m.name&&String(m.name).trim()){ found=true; return; }
        for(const k in m){ const t=m[k]; if(t&&t.isTexture){ found=true; return; } }
      }
    });
    return found;
  }

  /* A .glb that carries no material gets the viewer default written into its own data
     before it is ever shown, so it cannot appear white for a moment first. Only the JSON
     part is rebuilt; the geometry data is copied over untouched. */
  async function bakeDefaultMaterial(blob){
    try{
      const src=new Uint8Array(await blob.arrayBuffer());
      if(src.length<20) return null;
      const dv=new DataView(src.buffer);
      if(dv.getUint32(0,true)!==0x46546c67) return null;
      const total=dv.getUint32(8,true);
      if(total>src.length) return null;
      let off=12, jsonLen=0, binStart=-1, binLen=0;
      while(off+8<=total){
        const len=dv.getUint32(off,true), type=dv.getUint32(off+4,true);
        const pad=(4-(len%4))%4;
        if(type===0x4e4f534a) jsonLen=len;
        else if(type===0x004e4942){ binStart=off+8; binLen=len; }
        off+=8+len+pad;
      }
      if(!jsonLen) return null;
      let json;
      try{ json=JSON.parse(new TextDecoder().decode(src.subarray(20,20+jsonLen))); }catch(_){ return null; }
      if(Array.isArray(json.materials)&&json.materials.length) return null;   // the file has its own
      const index=Array.isArray(json.materials)?json.materials.length:0;
      json.materials=(json.materials||[]).concat([viewerDefaultMaterialJSON()]);
      let touched=false;
      (json.meshes||[]).forEach(mesh=>{ (mesh.primitives||[]).forEach(p=>{ if(p.material===undefined){ p.material=index; touched=true; } }); });
      if(!touched) return null;
      let jb=new TextEncoder().encode(JSON.stringify(json));
      const jpad=(4-(jb.length%4))%4;
      if(jpad){ const t=new Uint8Array(jb.length+jpad); t.set(jb); t.fill(32,jb.length); jb=t; }
      const binPad=binStart>=0? (4-(binLen%4))%4 : 0;
      const newTotal=12+8+jb.length+(binStart>=0? 8+binLen+binPad : 0);
      const out=new Uint8Array(newTotal), odv=new DataView(out.buffer);
      odv.setUint32(0,0x46546c67,true); odv.setUint32(4,2,true); odv.setUint32(8,newTotal,true);
      odv.setUint32(12,jb.length,true); odv.setUint32(16,0x4e4f534a,true); out.set(jb,20);
      if(binStart>=0){
        const p2=20+jb.length;
        odv.setUint32(p2,binLen,true); odv.setUint32(p2+4,0x004e4942,true);
        out.set(src.subarray(binStart,binStart+binLen),p2+8);
      }
      return new Blob([out],{type:'model/gltf-binary'});
    }catch(_){ return null; }
  }
  async function convertToGLB(file,extras){
    const ext=extOf(file.name);
    const base=file.name.replace(/\.[^.]+$/,'');
    if(ext==='stp'||ext==='step') return convertStepWithOcct(file);
    /* STL cannot store a material: the viewer default is the right thing for it. */
    if(ext==='stl'){ const m=stlToModel(await file.arrayBuffer()); m.meshes[0].name=base; recenterModel(m); return {blob:writeGLB(m),note:'',matSource:'default'}; }
    /* OBJ: only a real .mtl makes it a material of the file. */
    if(ext==='obj'){ const m=await objToModel(await file.text(),extras,base); recenterModel(m); return {blob:writeGLB(m),note:'',matSource:m.mtlUsed?'file':'default'}; }
    return convertWithThree(file,extras);
  }

  // Load into the requested slot only. Existing models in other slots are left untouched.
  // `input` can be one File or a list of files (model + its .mtl / textures / .bin).
  async function loadFile(slot,input){
    const list=(input && typeof input.length==='number')? input : (input?[input]:[]);
    if(!list.length) return;
    const {main,extras}=splitFiles(list);
    if(!main){ showToast('Unsupported file. Use GLB, GLTF, FBX, OBJ, STL, PLY, DAE, 3MF, 3DS, STEP or STP.'); return; }
    const token=(slot._loadToken=(slot._loadToken||0)+1);
    let blob=main, note='', matSource=null;
    if(extOf(main.name)!=='glb'){
      showToast('Opening '+main.name+'…');
      try{ const res=await convertToGLB(main,extras); blob=res.blob; note=res.note||''; matSource=res.matSource||null; }
      catch(err){
        console.error(err);
        if(slot._loadToken===token) showToast('Could not open this file: '+((err&&err.message)||'unknown error'));
        return;
      }
      if(slot._loadToken!==token || !slot.el.isConnected) return;
      toast.classList.add('hidden');
      if(note) showToast(note);
    }else{
      /* A GLB is opened as it is, so its materials are read straight from the file. */
      const info=await glbMaterialInfo(blob);
      if(slot._loadToken!==token) return;
      matSource=info?((info.material||info.texture)?'file':'default'):null;
      if(matSource==='default'){
        /* the viewer default is written into the file, so it shows up with its material
           from the very first frame instead of white and then restyled */
        const baked=await bakeDefaultMaterial(blob);
        if(slot._loadToken!==token) return;
        if(baked) blob=baked;
      }
    }
    const file=main;
    stopAnimationTicker(slot);
    if(slot.compositeURL){URL.revokeObjectURL(slot.compositeURL);slot.compositeURL=null;}
    if(slot.objectURL)URL.revokeObjectURL(slot.objectURL);
    slot.objectURL=URL.createObjectURL(blob); slot.baseKey=null; slot.baseInfo=null; slot.baseParams={height:null,margin:1.16}; slot._userMat=new Map();
    /* Material bookkeeping for this file: where its material comes from, what it looked
       like when it arrived and whether the user has changed it since. */
    slot._matSource=matSource||'file';        /* unknown => never touch the file's own material */
    slot._matOriginSource=slot._matSource; /* permanent: used by Reset */
    slot._matInitial=null; slot._matUser=false; slot._matReady=false; slot._matPending=false; slot._vertexColors=false;
    slot._preserveMatSelect=null; slot._matTarget='all';
    slot._matToken=(slot._matToken||0)+1;
    if(slot._presetURL){URL.revokeObjectURL(slot._presetURL);slot._presetURL=null;}
    slot._override=null; slot._presetBusy=false;
    slot.plainLook=false;
    markActivePreset(slot,null);
    if(slot.viewer) slot.viewer.__focus=null;
    slot.settings.classList.add('hidden');
    slot.fileNameEl.textContent=file.name; slot.fileNameEl.title=file.name;
    slot.empty.classList.add('hidden'); slot.settingsGear.classList.remove('hidden'); slot.closeBtn.classList.remove('hidden'); slot.loading=true;
    slot.animFloat.classList.add('hidden');
    slot.animPicker.classList.add('hidden');
    slot.playing=false;
    slot.rate=1;
    if(!slot.viewer)makeViewer(slot);
    /* v11: material source is already known here (read from the file before display),
       so the matching light is set before the model is loaded: no restyle after show. */
    slot.plainLook=(slot._matSource!=='file');
    try{ setPlainLighting(slot.viewer, slot.plainLook, false); applyPlainLook(slot); }catch(_){}
    slot._revealAnim=true;   /* every model opens with the reveal animation (own material or viewer default) */
    // Hide until load+initModelMaterials finishes so plain/default colour never flashes
    slot.viewer.classList.add('mv-reveal-pending');
    slot.viewer.classList.remove('mv-revealed');
    slot.viewer.src=slot.objectURL;
    /* hard safety: if load event never fires, still show the model */
    setTimeout(()=>{ try{ slot.viewer && slot.viewer.classList.remove('mv-reveal-pending'); slot.viewer && slot.viewer.classList.add('mv-revealed'); }catch(_){} }, 4000);
    updateObjectCards(slot);
    updatePaneGrid(slot.pane); setGlobalVisibility();
  }

  function removeSlot(slot){
    stopAnimationTicker(slot);
    if(slot.compositeURL)URL.revokeObjectURL(slot.compositeURL);
    if(slot.objectURL)URL.revokeObjectURL(slot.objectURL);
    if(slot._presetURL)URL.revokeObjectURL(slot._presetURL);
    if(slot.bgURL)URL.revokeObjectURL(slot.bgURL);
    const pane=slot.pane;
    pane.slots=pane.slots.filter(s=>s!==slot);
    slot.el.remove();
    if(pane.slots.length===0)createSlot(pane);
    updatePaneGrid(pane); setGlobalVisibility();
  }

  function removePaneById(id){
    if(paneCount<=1)return;
    const index=panes.findIndex(p=>p.id===id); if(index<0)return;
    const layoutEl=document.getElementById('compareLayout');
    if(layoutEl) layoutEl.classList.remove('has-expanded');
    closeSceneToolPanels();
    const pane=panes[index]; pane.slots.forEach(s=>{stopAnimationTicker(s);if(s.compositeURL)URL.revokeObjectURL(s.compositeURL);if(s.objectURL)URL.revokeObjectURL(s.objectURL);if(s._presetURL)URL.revokeObjectURL(s._presetURL);if(s.bgURL)URL.revokeObjectURL(s.bgURL);}); pane.el.remove(); panes.splice(index,1); paneCount=panes.length;
    renderLayout();
  }

  function renderLayout(){
    layout.dataset.count=String(paneCount);
    layout.innerHTML='';
    panes.slice(0,paneCount).forEach((p,i)=>{p.label.textContent='View '+(i+1); layout.appendChild(p.el); updatePaneGrid(p);});
    setGlobalVisibility();
  }

  function buildLayoutPanel(){
    layoutChoices.innerHTML='';
    [1,2,3,4].forEach(n=>{
      const b=document.createElement('button'); b.className='layout-choice'+(n===paneCount?' active':''); b.dataset.count=n; b.title=n===1?'Single view':n+' comparison views';
      b.innerHTML = (n===1?'<span>1</span>':n===2?svg('compare'):(n===3?'3':'4'));
      b.addEventListener('click',()=>setPaneCount(n));
      layoutChoices.appendChild(b);
    });

  /* ---- Build Components (Level 1) ----

  function buildComponents(meshes){

      const cnt=pos.count;

      for(let i=0;i<cnt;i++){

  /* ---- Group Components → Item Instances (Level 2) ----

  function groupComponentsToInstances(components, sceneDiag){

      return Math.max(c.dx,1e-12)*Math.max(c.dy,1e-12)*Math.max(c.dz,1e-12);
    }

      // how much of B's volume sits inside A's expanded box
      const pad=Math.max(sceneDiag*0.008, Math.min(A.size,B.size)*0.04);
      let inter=1;
      for(let a=0;a<3;a++){

       Complementary surfaces of one product (rim+floor) usually differ more in

      if(ratio<1.45 && vRatio<2.5){

        const minH=Math.min(
          Math.max(A.dy,A.dx*0.15,A.dz*0.15),
          Math.max(B.dy,B.dx*0.15,B.dz*0.15)

    // Sort larger first so containment absorbs smaller parts into bigger shells
    const order=[...Array(n).keys()].sort((i,j)=>components[j].size-components[i].size);

        const cBA=containment(B,A); // A inside B?
        const cont=Math.max(cAB,cBA);

        // Classic: smaller piece mostly inside larger → same product
        if(cont>=0.55){ unite(i,j); continue; }

        // Very close centres + one clearly smaller → likely attached part
        const d=centerDist(A,B);

  function groupInstancesToTypes(instances){
    const types=[];

      for(let k=0;k<3;k++) if(!near(sa[k],sb[k],0.018)) return false;

      if(!near(A.area,B.area,0.04) && A.area>1e-8 && B.area>1e-8) return false;
      if(!near(A.tris,B.tris,0.05) && A.tris>10 && B.tris>10) return false;

      if(A.matSig!==B.matSig) return false;
      return true;
    }
    instances.forEach(inst=>{
      const twin=types.find(t=>sameType(t.rep,inst));
      if(twin){

        types.push({rep:inst, copies:[], quantity:1, box:inst.box});

    types.sort((a,b)=>b.rep.size-a.rep.size);

  function detectItems(slot){
    const meshes=measurableMeshes(slot); if(!meshes) return null;

    // scene diagonal from all component extents
    let mnx=Infinity,mny=Infinity,mnz=Infinity,mxx=-Infinity,mxy=-Infinity,mxz=-Infinity;
    components.forEach(c=>{
      mnx=Math.min(mnx,c.min[0]); mny=Math.min(mny,c.min[1]); mnz=Math.min(mnz,c.min[2]);
      mxx=Math.max(mxx,c.max[0]); mxy=Math.max(mxy,c.max[1]); mxz=Math.max(mxz,c.max[2]);

    const instances=groupComponentsToInstances(components,diag);

    // {items:[{piece, box, copies:[]}], diag}
    // where each "item" is a Type; copies hold extra Instance boxes
    const items=types.map(t=>{
      const box=t.box;

    addons:'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/',
    mv:'https://cdn.jsdelivr.net/npm/@google/model-viewer@4.1.0/dist/model-viewer.min.js',
    occt:'https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/occt-import-js.min.js',
    wasm:'https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/occt-import-js.wasm'
  };
  const OFFLINE_ADDONS=['exporters/GLTFExporter.js','loaders/GLTFLoader.js','loaders/FBXLoader.js','loaders/PLYLoader.js','loaders/ColladaLoader.js','loaders/3MFLoader.js','loaders/TDSLoader.js','geometries/RoundedBoxGeometry.js'];
  const OFFLINE_IMPORT_RE=/(\bfrom\s*|\bimport\s*\(\s*|\bimport\s*)(["'])([^"'\n]+)\2/g;
  function offlineResolve(spec,base){
    if(spec==='three') return OFFLINE_URLS.three;
    if(spec.indexOf('three/addons/')===0) return OFFLINE_URLS.addons+spec.slice(13);
    if(/^https?:/.test(spec)) return spec;
    if(spec[0]==='.'||spec[0]==='/') return new URL(spec,base).href;
    return spec;
  }
  /* This function's source is copied into the offline file and runs there BEFORE the app. */
  function offlineBoot(){
    var THREE_URL='https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';
    var ADDONS='https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/';
    var MV_URL='https://cdn.jsdelivr.net/npm/@google/model-viewer@4.1.0/dist/model-viewer.min.js';
    var OCCT_URL='https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/occt-import-js.min.js';
    var IMPORT_RE=/(\bfrom\s*|\bimport\s*\(\s*|\bimport\s*)(["'])([^"'\n]+)\2/g;
    var files=JSON.parse(document.getElementById('offline-libs').textContent).files;
    var cache={}, busy={};
    function resolve(spec,base){
      if(spec==='three') return THREE_URL;
      if(spec.indexOf('three/addons/')===0) return ADDONS+spec.slice(13);
      if(/^https?:/.test(spec)) return spec;
      if(spec.charAt(0)==='.'||spec.charAt(0)==='/') return new URL(spec,base).href;
      return spec;
    }
    function blobURL(url){
      if(cache[url]) return cache[url];
      if(busy[url]) throw new Error('circular import '+url);
      var src=files[url]; if(src==null) throw new Error('Missing offline file: '+url);
      busy[url]=1;
      var out=src.replace(IMPORT_RE,function(m,pre,q,spec){
        var u=resolve(spec,url);
        if(!Object.prototype.hasOwnProperty.call(files,u)) return m;
        return pre+q+blobURL(u)+q;
      });
      busy[url]=0;
      cache[url]=URL.createObjectURL(new Blob([out],{type:'text/javascript'}));
      return cache[url];
    }
    window.__libImport=function(spec){
      try{ return import(blobURL(resolve(spec,ADDONS))); }catch(e){ return Promise.reject(e); }
    };
    // 3D engine
    var mv=document.createElement('script'); mv.type='module'; mv.src=blobURL(MV_URL); document.head.appendChild(mv);
    // STEP engine
    if(files[OCCT_URL]){ var s=document.createElement('script'); s.text=files[OCCT_URL]; document.head.appendChild(s); }
    window.__occtOptions=function(){
      var el=document.getElementById('offline-wasm');
      var t=el&&el.textContent.trim(); if(!t) return undefined;
      var bin=atob(t), u8=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
      return {wasmBinary:u8.buffer};
    };
  }
  async function crawlOfflineLibs(fetchText,onProgress){
    const files={}, queued=new Set();
    const queue=[OFFLINE_URLS.mv,OFFLINE_URLS.occt,OFFLINE_URLS.three,...OFFLINE_ADDONS.map(p=>OFFLINE_URLS.addons+p)];
    queue.forEach(u=>queued.add(u));
    let done=0;
    while(queue.length){
      const batch=queue.splice(0,6);
      await Promise.all(batch.map(async u=>{
        let text;
        try{ text=await fetchText(u); }
        catch(err){
          if(u===OFFLINE_URLS.occt) return;                          // the STEP engine is optional
          if(u===OFFLINE_URLS.three){ text=await fetchText(u.replace('.module.min.js','.module.js')); }   // fall back to the non-minified build
          else throw err;
        }
        files[u]=text;
        if(u.indexOf(OFFLINE_URLS.addons)===0){
          text.replace(OFFLINE_IMPORT_RE,(m,pre,q,spec)=>{
            const r=offlineResolve(spec,u);
            if(r.indexOf(OFFLINE_URLS.addons)===0 || r===OFFLINE_URLS.three){ if(!queued.has(r)){ queued.add(r); queue.push(r); } }
            return m;
          });
        }
        done++; if(onProgress) onProgress(done,queued.size);
      }));
    }
    return files;
  }
  function assembleOfflineHTML(pristine,files,wasmB64){
    const a=pristine.indexOf(LT+'!--CDN-BEGIN-->'), b=pristine.indexOf(LT+'!--CDN-END-->');
    if(a<0||b<0||b<a) throw new Error('Page markers not found');
    const json=JSON.stringify({files}).replace(/<\/(script)/gi,'<\\/$1').replace(new RegExp(LT+'!--','g'),'\\u003c!--');
    const block=LT+'!--CDN-BEGIN-->\n'+LT+'script id="offline-libs" type="application/json">'+json+LT+'/script>\n'
      +LT+'script id="offline-wasm" type="text/plain">'+(wasmB64||'')+LT+'/script>\n'
      +LT+'script>('+offlineBoot.toString()+')();'+LT+'/script>\n';
    return pristine.slice(0,a)+block+pristine.slice(b);
  }
  async function buildOfflineCopy(btn){
    if(window.__libImport){ showToast('This is already the offline copy.'); return false; }
    if(navigator.onLine===false){ showToast('Connect to the internet once to install the offline version.'); return false; }
    const lbl=btn.querySelector('.lbl')||btn, label=t=>{ lbl.textContent=t; };
    let ok=false;
    btn.classList.add('busy');
    try{
      showToast('Downloading libraries for offline use…');
      const fetchText=async u=>{ const r=await fetch(u); if(!r.ok) throw new Error('HTTP '+r.status+' '+u); return r.text(); };
      const files=await crawlOfflineLibs(fetchText,(n,t)=>{ label('Downloading '+n+'/'+t+'…'); });
      let wasmB64='';
      try{
        label('Downloading STEP engine…');
        const r=await fetch(OFFLINE_URLS.wasm); if(!r.ok) throw new Error('HTTP '+r.status);
        const u8=new Uint8Array(await r.arrayBuffer()); let bin=''; const CH=0x8000;
        for(let i=0;i<u8.length;i+=CH) bin+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));
        wasmB64=btoa(bin);
      }catch(_){ showToast('STEP engine could not be included; STEP files will need internet.'); }
      label('Building file…');
      const html=assembleOfflineHTML(PRISTINE_HTML,files,wasmB64);
      const blob=new Blob([html],{type:'text/html'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='3d_viewer_offline.html';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),60000);
      showToast('Offline version saved (3d_viewer_offline.html, '+(blob.size/1048576).toFixed(1)+' MB). Open that file when you have no internet.');
      ok=true;
    }catch(err){
      console.error(err);
      showToast('Could not download the libraries. Open the downloaded HTML file (not the online link) while connected to the internet, then try again.');
    }finally{
      btn.classList.remove('busy'); label('Install offline');
    }
    return ok;
  }
  /* "Install offline" button on the start screen (online page only). Hidden for good
     once the offline file has been downloaded in this browser, and always hidden in the
     offline file itself and as soon as a model is open. */
  const OFFLINE_FLAG='viewer3d.offlineInstalled';
  function offlineInstalled(){ try{ return localStorage.getItem(OFFLINE_FLAG)==='1'; }catch(_){ return false; } }
  function updateInstallBtn(startScreen){
    const b=document.getElementById('offlineInstall'); if(!b) return;
    const show=!window.__libImport && !offlineInstalled() && !!startScreen;
    b.classList.toggle('hidden',!show);
  }
  { const b=document.getElementById('offlineInstall');
    if(b){
      b.addEventListener('pointerdown',e=>e.stopPropagation());
      b.addEventListener('click',async e=>{
        e.preventDefault(); e.stopPropagation();
        const ok=await buildOfflineCopy(b);
        if(ok){ try{ localStorage.setItem(OFFLINE_FLAG,'1'); }catch(_){} b.classList.add('hidden'); }
      });
    }
  }

  createPane(); activatePane(panes[0]); renderLayout(); buildLayoutPanel();
  /* When online, quietly fetch the FBX converter once so the browser keeps it for offline use. */
  if(navigator.onLine!==false){
    const idle=window.requestIdleCallback? (f=>window.requestIdleCallback(f,{timeout:6000})) : (f=>setTimeout(f,3000));
    idle(()=>{ loadThreeLib().then(()=>importAddon('loaders/FBXLoader.js')).catch(()=>{}); });
  }
  customElements.whenDefined('model-viewer').then(()=>showToast('3D viewer ready')).catch(()=>showToast('3D viewer could not be loaded. Check the internet connection for the 3D engine.'));
})();
</script>
